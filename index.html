<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Opening Obsidian…</title>
<style>body{font:16px/1.5 -apple-system,system-ui,sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;background:#f4f4f6;color:#222}
a{display:inline-block;padding:12px 18px;border-radius:10px;background:#7c3aed;color:#fff;text-decoration:none}</style></head>
<body><main><p>Opening your note in Obsidian…</p><p><a id="go" href="#">Open in Obsidian</a></p></main>
<script>
// Everything after '#' stays on your phone: browsers never send the fragment to the server.
// Format: #<vault>/<path/to/note.md>  (vault defaults to Studio)
var h = decodeURIComponent(location.hash.slice(1));
var vault = "Studio", file = h;
if (h.indexOf("::") > 0) { vault = h.split("::")[0]; file = h.split("::").slice(1).join("::"); }
var url = "obsidian://open?vault=" + encodeURIComponent(vault) + "&file=" + encodeURIComponent(file.replace(/\.md$/, ""));
document.getElementById("go").href = url;
if (file) location.replace(url);
</script></body></html>
